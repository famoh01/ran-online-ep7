name: Android Emulator Smoke Test (x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c988b52-ran-online-ep7
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'RANMobile/**'

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER
          ls -l /dev/kvm || true

      - name: Setup Java 17 & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build x86 Debug APK for Emulator
        working-directory: RANMobile/Android
        run: |
          gradle assembleDebug -PabiFilters=x86
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Run Emulator Smoke Test (Boot, Launch, Tap, Screencap, Logcat)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb install -r RANMobile/Android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.famhawaii.ranmobile/android.app.NativeActivity
            sleep 5
            adb exec-out screencap -p > emulator-screenshot-before.png
            adb shell input tap 640 420
            sleep 2
            adb exec-out screencap -p > emulator-screenshot-after.png
            adb logcat -d -t 800 > logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal|AndroidRuntime: FATAL|Process com\.famhawaii\.ranmobile .* has died" logcat.txt; then
              echo "CRASH_DETECTED"
              exit 1
            fi
            ls -lh emulator-screenshot-before.png emulator-screenshot-after.png logcat.txt

      - name: Upload Emulator Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-test-artifacts
          path: |
            emulator-screenshot-before.png
            emulator-screenshot-after.png
            logcat.txt
