name: EP7 Server & MSSQL Database Verify (Windows Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c988b52-ran-online-ep7
    paths:
      - '.github/workflows/ep7-server-db-verify.yml'

jobs:
  verify-ep7-db:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull EP7 Database Backups (.bak & .sql) via Git LFS
        run: |
          git lfs install
          $env:GIT_LFS_SKIP_SMUDGE="1"
          git clone --depth 1 https://github.com/matheomedrana/Ran-Online-EP7-Complete-Files.git C:\ep7_db
          cd C:\ep7_db
          git lfs pull --include="Ran Online Database/**"
          Get-ChildItem -Recurse "Ran Online Database" | Select-Object Name, Length

      - name: Verify SQL Server LocalDB & Database Files
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT @@VERSION"
          $bakDir = "C:\ep7_db\Ran Online Database\Ran Online Database Backup Files (.bak)"
          mkdir C:\ep7_db\data -Force
          $conn = New-Object System.Data.SqlClient.SqlConnection("Server=(localdb)\MSSQLLocalDB;Integrated Security=true;")
          $conn.Open()
          foreach ($db in @("RanUser", "RanGame1", "RanShop", "RanLog")) {
            $bak = Join-Path $bakDir "$db.bak"
            if (Test-Path $bak) {
              Write-Output "FOUND_BAK: $db ($((Get-Item $bak).Length) bytes)"
              $cmd = $conn.CreateCommand()
              $cmd.CommandText = "RESTORE FILELISTONLY FROM DISK = N'$bak'"
              $da = New-Object System.Data.SqlClient.SqlDataAdapter($cmd)
              $dt = New-Object System.Data.DataTable
              [void]$da.Fill($dt)
              $moves = @()
              $idx = 0
              foreach ($row in $dt.Rows) {
                $logical = $row["LogicalName"].ToString().Trim()
                $ext = if ($row["Type"].ToString().Trim() -eq "L") { "_log.ldf" } else { "_$idx.mdf" }
                $moves += "MOVE N'$logical' TO N'C:\ep7_db\data\${db}${ext}'"
                $idx++
              }
              $moveClause = $moves -join ", "
              $cmd.CommandText = "RESTORE DATABASE [$db] FROM DISK = N'$bak' WITH $moveClause, REPLACE, RECOVERY"
              $cmd.CommandTimeout = 300
              [void]$cmd.ExecuteNonQuery()
              sqlcmd -S "(localdb)\MSSQLLocalDB" -d $db -Q "SELECT COUNT(*) AS TableCount FROM INFORMATION_SCHEMA.TABLES"
            } else {
              Write-Error "MISSING_BAK: $bak"
            }
          }
          $conn.Close()
