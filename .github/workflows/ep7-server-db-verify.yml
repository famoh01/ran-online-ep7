name: EP7 Server & MSSQL Database Verify (Windows Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c988b52-ran-online-ep7
    paths:
      - '.github/workflows/ep7-server-db-verify.yml'

jobs:
  verify-ep7-db:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull EP7 Database Backups (.bak & .sql) via Git LFS
        run: |
          git lfs install
          $env:GIT_LFS_SKIP_SMUDGE="1"
          git clone --depth 1 https://github.com/matheomedrana/Ran-Online-EP7-Complete-Files.git C:\ep7_db
          cd C:\ep7_db
          git lfs pull --include="Ran Online Database/**"
          Get-ChildItem -Recurse "Ran Online Database" | Select-Object Name, Length

      - name: Restore & Verify EP7 Databases on SQL Server LocalDB
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "SELECT @@VERSION"
          $bakDir = "C:\ep7_db\Ran Online Database\Ran Online Database Backup Files (.bak)"
          mkdir C:\ep7_db\data -Force
          foreach ($db in @("RanUser", "RanGame1", "RanShop", "RanLog")) {
            $bak = Join-Path $bakDir "$db.bak"
            if (Test-Path $bak) {
              Write-Output "FOUND_BAK: $db ($((Get-Item $bak).Length) bytes)"
              $lines = sqlcmd -S "(localdb)\MSSQLLocalDB" -W -s "|" -Q "SET NOCOUNT ON; RESTORE FILELISTONLY FROM DISK = N'$bak'"
              $moves = @()
              $idx = 0
              foreach ($line in $lines) {
                if ($line -match "\|" -and $line -notmatch "^LogicalName\|" -and $line -notmatch "^-+") {
                  $cols = $line -split "\|"
                  if ($cols.Count -ge 3) {
                    $logical = $cols[0].Trim()
                    $ftype = $cols[2].Trim()
                    if ($logical -ne "" -and ($ftype -eq "D" -or $ftype -eq "L")) {
                      $ext = if ($ftype -eq "L") { "_log.ldf" } else { "_$idx.mdf" }
                      $moves += "MOVE N'$logical' TO N'C:\ep7_db\data\${db}${ext}'"
                      $idx++
                    }
                  }
                }
              }
              $moveClause = $moves -join ", "
              $restoreSql = "RESTORE DATABASE [$db] FROM DISK = N'$bak' WITH $moveClause, REPLACE, RECOVERY"
              Write-Output "EXEC: $restoreSql"
              sqlcmd -S "(localdb)\MSSQLLocalDB" -Q $restoreSql
              if ($LASTEXITCODE -ne 0) { exit 1 }
              sqlcmd -S "(localdb)\MSSQLLocalDB" -d $db -Q "SELECT TOP 10 TABLE_NAME FROM INFORMATION_SCHEMA.TABLES ORDER BY TABLE_NAME"
              if ($LASTEXITCODE -ne 0) { exit 1 }
            } else {
              Write-Error "MISSING_BAK: $bak"
              exit 1
            }
          }
