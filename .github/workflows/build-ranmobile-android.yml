name: Build RANMobile Android (ARM64) & Verify EP7 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

# Three INDEPENDENT jobs, deliberately not chained with `needs`:
#
#   core-tests            C++17 suite + Phase 3J character suite. Must be able to fail CI on
#                         its own, and must never be skipped because of asset verification.
#   authentic-assets      Real client data validation. Isolated so that a coverage gap in a
#                         format this build does not implement (BLOCKERS.md B11) cannot stop
#                         unrelated core tests from running or hide their result.
#   android-arm64         Native lib + APK/AAB. Needs no client data at all.
#
# Because the jobs are independent, the workflow's overall status is the AND of the three
# real statuses: core failures are never masked, and an UNSUPPORTED asset verdict shows up
# as a distinct, readable outcome rather than as a green tick on a failed suite.
jobs:
  core-tests:
    name: Core C++17 tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Restored in the merged session (2026-11-27): the core tests include data-dependent
      # assertions (ThaiPackLoader ntk/qst counts, EP7 asset pipeline). PR #4's single job
      # downloaded the release data before running them and was green; PR #5's split job
      # compiled the core binary but never executed it, which silently dropped those checks.
      # The download step is duplicated from the authentic-assets job on purpose: each job
      # must be independently runnable.
      - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p external/ep7_release/original external/ep7_release/client_original external/ep7_release/thaipack_original
          gh release download ran-ep7-full-v1 \
            --repo famoh01/ran-online-ep7 \
            --pattern "RAN-EP7-Client-TH.zip.part*" \
            --pattern "RAN-EP7-ThaiPack-FamHawaii.zip" \
            --dir external/ep7_release/original
          cat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \
              external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \
              > external/ep7_release/original/RAN-EP7-Client-TH.zip
          unzip -t external/ep7_release/original/RAN-EP7-Client-TH.zip > /dev/null
          unzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original
          unzip -q -o external/ep7_release/original/RAN-EP7-ThaiPack-FamHawaii.zip -d external/ep7_release/thaipack_original
          echo "=== EP7 DATA VERIFICATION ==="
          find external/ep7_release/client_original -maxdepth 3 \( -iname "mapslist.mst" -o -iname "crow.mnsf" -o -iname "item.isf" -o -iname "skill.ssf" -o -iname "quest.lst" \)

      - name: Run Linux C++17 Unit & Integration Tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            RANMobile/Engine/Core/Logger.cpp \
            RANMobile/Engine/Core/RANMobileEngine.cpp \
            RANMobile/Engine/Renderer/MobileRenderer.cpp \
            RANMobile/Engine/Resource/ResourceManager.cpp \
            RANMobile/Engine/Touch/TouchSystem.cpp \
            RANMobile/Engine/Camera/MobileCamera.cpp \
            RANMobile/Engine/Animation/AnimationManager.cpp \
            RANMobile/Engine/Animation/EP7SkinAniControl.cpp \
            RANMobile/Engine/Audio/AudioManager.cpp \
            RANMobile/Engine/Network/NetworkClient.cpp \
            RANMobile/Data/Validator/DataValidator.cpp \
            RANMobile/Data/Importer/EP7AssetImporter.cpp \
            RANMobile/Data/Importer/EP7TextureDecoder.cpp \
            RANMobile/Data/Importer/EP7WorldCharParser.cpp \
            RANMobile/Data/Importer/EP7Animation.cpp \
            RANMobile/Data/Importer/EP7CharacterFile.cpp \
            RANMobile/Data/Importer/EP7RccArchive.cpp \
            RANMobile/Data/Importer/EP7Skeleton.cpp \
            RANMobile/Data/Importer/EP7SkinPiece.cpp \
            RANMobile/Data/Importer/EP7SkinnedMesh.cpp \
            RANMobile/Data/Importer/EP7XFile.cpp \
            RANMobile/Engine/Scene/EP7CharacterScene.cpp \
            RANMobile/UI/Character/CharacterPreviewOverlay.cpp \
            RANMobile/Data/Converter/RANMobileDataConverter.cpp \
            RANMobile/Data/Loader/GameDataLoader.cpp \
            RANMobile/Data/Loader/ThaiPackLoader.cpp \
            RANMobile/Client/Login/AuthenticationManager.cpp \
            RANMobile/Client/Character/CharacterSelectManager.cpp \
            RANMobile/Client/Gameplay/CharacterController.cpp \
            RANMobile/Client/Combat/TargetManager.cpp \
            RANMobile/Client/Combat/CombatController.cpp \
            RANMobile/Client/Inventory/InventoryManager.cpp \
            RANMobile/Client/Quest/QuestManager.cpp \
            RANMobile/Client/Map/MapManager.cpp \
            RANMobile/Client/Chat/ChatManager.cpp \
            RANMobile/UI/Login/LoginScreen.cpp \
            RANMobile/UI/Joystick/VirtualJoystick.cpp \
            RANMobile/UI/Buttons/MobileButton.cpp \
            RANMobile/UI/Buttons/MobileSkillButton.cpp \
            RANMobile/UI/HUD/MobileHUD.cpp \
            RANMobile/UI/Quest/QuestUI.cpp \
            RANMobile/Server/MobileServerHost.cpp \
            RANMobile/Tests/test_main.cpp \
            -lpthread -o ranmobile_tests 2>&1 | tee -a compile_output.log

      - name: Run Linux C++17 Tests
        run: |
          set +e
          ./ranmobile_tests > test_output.log 2>&1
          TEST_EXIT=$?
          set -e
          echo "TEST_EXIT=$TEST_EXIT" >> $GITHUB_ENV
          cat test_output.log
          if [ $TEST_EXIT -ne 0 ]; then
            ERR_LINE=$(grep -i "Assertion\|Aborted\|Error\|fail" test_output.log | tail -n 5 | tr '\n' ' ')
            echo "::error::ranmobile_tests failed (exit $TEST_EXIT): $ERR_LINE"
          fi
          exit $TEST_EXIT

      - name: Build & Run Phase 3J Character Tests
        run: |
          set -e
          set -o pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            RANMobile/Engine/Core/Logger.cpp \
            RANMobile/Engine/Renderer/MobileRenderer.cpp \
            RANMobile/Engine/Camera/MobileCamera.cpp \
            RANMobile/Engine/Scene/EP7CharacterScene.cpp \
            RANMobile/Engine/Animation/EP7SkinAniControl.cpp \
            RANMobile/Data/Importer/EP7Animation.cpp \
            RANMobile/Data/Importer/EP7CharacterFile.cpp \
            RANMobile/Data/Importer/EP7RccArchive.cpp \
            RANMobile/Data/Importer/EP7Skeleton.cpp \
            RANMobile/Data/Importer/EP7SkinPiece.cpp \
            RANMobile/Data/Importer/EP7SkinnedMesh.cpp \
            RANMobile/Data/Importer/EP7TextureDecoder.cpp \
            RANMobile/Data/Importer/EP7XFile.cpp \
            RANMobile/Tests/test_phase3j.cpp \
            -lpthread -o ranmobile_phase3j_tests
          ./ranmobile_phase3j_tests 2>&1 | tee phase3j_test_output.log

      - name: Verifier regression tests (normal, ASan, UBSan, LSan)
        run: |
          set -o pipefail
          bash RANMobile/Tests/run_ep7_verifier_tests.sh 2>&1 | tee verifier_test_output.log
          echo "::notice title=Verifier regression and sanitizers::$(grep -E 'Verifier regression:|Sanitizers:' verifier_test_output.log | tr '\n' ';')"

      - name: Write Test Summary
        if: always()
        run: |
          {
            echo "### Core C++17 Test Summary: ${{ job.status }}"
            echo "- Exit Code: ${TEST_EXIT:-unknown}"
            echo '```'
            tail -n 60 test_output.log 2>/dev/null || echo "No test_output.log"
            echo '```'
            echo "### Phase 3J Character Tests"
            echo '```'
            tail -n 30 phase3j_test_output.log 2>/dev/null || echo "No phase3j_test_output.log"
            echo '```'
            echo "### external/ep7_release"
            ls -la external/ep7_release 2>/dev/null || echo "Missing external/ep7_release"
            ls -la external/ep7_release/thaipack_original 2>/dev/null | head -n 20 || echo "Missing thaipack_original"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Failed Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-logs
          path: |
            test_output.log
            phase3j_test_output.log
            verifier_test_output.log

  authentic-assets:
    name: Authentic EP7 asset verification (diagnostic)
    runs-on: ubuntu-latest
    # NOT continue-on-error: a genuine FAIL (exit 1) must fail this job and the workflow.
    # Only the UNSUPPORTED outcome (B11) is treated as non-blocking, and that decision is
    # made explicitly in the step below so the reason is visible in the log.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p external/ep7_release/original external/ep7_release/client_original external/ep7_release/thaipack_original
          gh release download ran-ep7-full-v1 \
            --repo famoh01/ran-online-ep7 \
            --pattern "RAN-EP7-Client-TH.zip.part*" \
            --pattern "RAN-EP7-ThaiPack-FamHawaii.zip" \
            --dir external/ep7_release/original
          cat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \
              external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \
              > external/ep7_release/original/RAN-EP7-Client-TH.zip
          unzip -t external/ep7_release/original/RAN-EP7-Client-TH.zip > /dev/null
          unzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original
          unzip -q -o external/ep7_release/original/RAN-EP7-ThaiPack-FamHawaii.zip -d external/ep7_release/thaipack_original
          echo "=== EP7 DATA VERIFICATION ==="
          find external/ep7_release/client_original -maxdepth 3 \( -iname "mapslist.mst" -o -iname "crow.mnsf" -o -iname "item.isf" -o -iname "skill.ssf" -o -iname "quest.lst" \)

      - name: Verify Authentic EP7 Character Assets
        # Runs the Phase 3J parsers against the REAL extracted client data.
        #
        # Outcome model (see RANMobile/Tools/verify_ep7_character_assets.cpp):
        #   exit 0  PASS         every pack entry parsed
        #   exit 1  FAIL         a pack entry is genuinely broken  -> this job FAILS
        #   exit 2  UNSUPPORTED  nothing failed, some formats have no definition in this
        #                        build (BLOCKERS.md B11)           -> this job stays green,
        #                        but the step emits ::warning:: and a summary that says so
        #   exit 3  NOT FOUND    no character entry in any pack     -> warning, not a failure
        #
        # UNSUPPORTED deliberately does NOT fail this job: the gap is a documented coverage
        # limit, not a regression, and the core test job is independent of it. It is never
        # reported as parsed, and the distinction is printed and annotated explicitly.
        run: |
          set -e
          g++ -std=c++17 -Wall -Wextra -Werror \
            RANMobile/Data/Importer/EP7Animation.cpp \
            RANMobile/Data/Importer/EP7CharacterFile.cpp \
            RANMobile/Data/Importer/EP7RccArchive.cpp \
            RANMobile/Data/Importer/EP7Skeleton.cpp \
            RANMobile/Data/Importer/EP7SkinPiece.cpp \
            RANMobile/Data/Importer/EP7SkinnedMesh.cpp \
            RANMobile/Data/Importer/EP7TextureDecoder.cpp \
            RANMobile/Data/Importer/EP7XFile.cpp \
            RANMobile/Engine/Core/Logger.cpp \
            RANMobile/Engine/Renderer/MobileRenderer.cpp \
            RANMobile/Engine/Camera/MobileCamera.cpp \
            RANMobile/Engine/Scene/EP7CharacterScene.cpp \
            RANMobile/Engine/Animation/EP7SkinAniControl.cpp \
            RANMobile/Tools/verify_ep7_character_assets.cpp \
            -o verify_ep7_character_assets
          if [ -d external/ep7_release/client_original ]; then
            set +e
            ./verify_ep7_character_assets external/ep7_release/client_original \
              2>&1 | tee phase3j_authentic_assets.log
            verify_status=${PIPESTATUS[0]}
            set -e
          else
            echo "external/ep7_release/client_original missing; nothing verified." \
              | tee phase3j_authentic_assets.log
            verify_status=3
          fi
          echo "verify_ep7_character_assets exit status: ${verify_status}"

          ok_count=$(grep -c '^  \[ OK \] ' phase3j_authentic_assets.log || true)
          arc_count=$(grep -c '^--- archive ' phase3j_authentic_assets.log || true)
          bad_count=$(grep -c '^  \[FAIL\] ' phase3j_authentic_assets.log || true)
          unsup_count=$(grep -c '^  \[UNSUP\] ' phase3j_authentic_assets.log || true)
          verdict=$(grep '^VERDICT: ' phase3j_authentic_assets.log | head -1 || true)
          packs=$(grep '^pack entries ' phase3j_authentic_assets.log | head -1 || true)
          reasons=$(grep -E '^ +[0-9]+ x ' phase3j_authentic_assets.log | head -8 | tr '\n' ';' || true)

          case "${verify_status}" in
            0) outcome="PASS" ;;
            1) outcome="FAIL" ;;
            2) outcome="UNSUPPORTED" ;;
            3) outcome="NOT FOUND" ;;
            *) outcome="ERROR(${verify_status})" ;;
          esac
          echo "ASSET_VERIFY_OUTCOME=$outcome" >> "$GITHUB_ENV"
          echo "ASSET_VERIFY_EXIT=$verify_status" >> "$GITHUB_ENV"

          # Annotations are the only channel that survives without credentials, and GitHub
          # keeps only the first ~10 per check run -- so the verdict goes first.
          case "${verify_status}" in
            0) echo "::notice title=Asset verification: PASS::${packs:-$ok_count ok} -- ${verdict:-all pack entries parsed}" ;;
            1) echo "::error title=Asset verification: FAIL::${packs:-$ok_count ok / $bad_count failed} -- ${verdict:-pack entries failed}" ;;
            2) echo "::warning title=Asset verification: UNSUPPORTED (B11)::$unsup_count pack entries are of a format this build has no definition for. NOT a regression and NOT counted as parsed; core tests are unaffected. ${packs}" ;;
            *) echo "::warning title=Asset verification: NOT FOUND::no authentic character entries were found; nothing was verified." ;;
          esac
          echo "::notice title=B11 bin classifications::$(grep '^bin classifications' phase3j_authentic_assets.log | tr '\n' ';')"
          if [ -n "$reasons" ]; then
            echo "::warning title=Asset verification - failure reasons::${reasons}"
          fi
          if [ "$unsup_count" -gt 0 ]; then
            echo "::warning title=Asset verification - unsupported formats (B11)::$(grep -c '^  \[UNSUP\] ' phase3j_authentic_assets.log || true) entries; see the job summary for the aggregated list."
          fi
          grep '^  \[FAIL\] ' phase3j_authentic_assets.log 2>/dev/null | head -8 | \
            while IFS= read -r line; do
              echo "::warning title=Authentic asset FAILED::${line}"
            done

          {
            echo "### Authentic Asset Verification: ${outcome}"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| parsed (PASS) | ${ok_count} |"
            echo "| failed (FAIL) | ${bad_count} |"
            echo "| unsupported (UNSUPPORTED, B11) | ${unsup_count} |"
            echo "| archives examined | ${arc_count} |"
            echo ""
            echo "\`${packs:-no pack line}\`"
            echo ""
            echo "\`${verdict:-no verdict line}\`"
            echo ""
            echo "**UNSUPPORTED is not a pass.** Those entries belong to formats with no"
            echo "definition in this repository (B11); they are neither parsed nor reported"
            echo "as successful."
            echo ""
            echo '```'
            sed -n '/unsupported formats (real data/,$p' phase3j_authentic_assets.log 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${verify_status}" -eq 1 ]; then
            echo "Failing this job: authentic pack entries exist that this build cannot parse."
            exit 1
          fi

      - name: Upload authentic verifier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3j-authentic-assets-log
          path: phase3j_authentic_assets.log

  android-arm64:
    name: Android ARM64 build (lib + APK/AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build RANMobile Native Library (arm64-v8a)
        run: |
          rm -rf build-android-arm64
          cmake -S RANMobile -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build-android-arm64 -j
          file build-android-arm64/libranmobile.so

      - name: Upload ARM64 Native Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libranmobile-arm64-v8a
          path: build-android-arm64/libranmobile.so

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK & AAB (assembleDebug, assembleRelease, bundleRelease)
        working-directory: RANMobile/Android
        run: |
          gradle assembleDebug assembleRelease bundleRelease
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ranmobile-android-packages
          path: |
            RANMobile/Android/app/build/outputs/apk/debug/*.apk
            RANMobile/Android/app/build/outputs/apk/release/*.apk
            RANMobile/Android/app/build/outputs/bundle/release/*.aab

  android-emulator-gpu-verification:
    name: Android Emulator GPU verification (GLES3 selftest)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # B19: boots a real Android emulator (x86_64 AVD with KVM) and runs the GPU
    # selftest harness inside the debug APK against the live GLES3 implementation
    # (SwiftShader).  Verdict JSON + screenshot are uploaded as artifacts; the job
    # conclusion reflects the harness verdict.  A physical-device run is still NOT
    # performed by this job.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p external/ep7_release/original external/ep7_release/client_original
          gh release download ran-ep7-full-v1 \
            --repo famoh01/ran-online-ep7 \
            --pattern "RAN-EP7-Client-TH.zip.part*" \
            --dir external/ep7_release/original
          cat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \
              external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \
              > external/ep7_release/original/RAN-EP7-Client-TH.zip
          unzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original

      - name: Build verify tool
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            RANMobile/Data/Importer/EP7Animation.cpp \
            RANMobile/Data/Importer/EP7CharacterFile.cpp \
            RANMobile/Data/Importer/EP7RccArchive.cpp \
            RANMobile/Data/Importer/EP7Skeleton.cpp \
            RANMobile/Data/Importer/EP7SkinPiece.cpp \
            RANMobile/Data/Importer/EP7SkinnedMesh.cpp \
            RANMobile/Data/Importer/EP7TextureDecoder.cpp \
            RANMobile/Data/Importer/EP7XFile.cpp \
            RANMobile/Engine/Core/Logger.cpp \
            RANMobile/Engine/Renderer/MobileRenderer.cpp \
            RANMobile/Engine/Camera/MobileCamera.cpp \
            RANMobile/Engine/Scene/EP7CharacterScene.cpp \
            RANMobile/Engine/Animation/EP7SkinAniControl.cpp \
            RANMobile/Tools/verify_ep7_character_assets.cpp \
            -o verify_ep7_character_assets

      - name: Select authentic character files for the APK bundle
        run: |
          mkdir -p bundle
          ./verify_ep7_character_assets external/ep7_release/client_original --bundle-plan bundle "" || true
          ls -la bundle/
          [ -f bundle/manifest.txt ] || { echo "::error::bundle-plan produced no manifest (see the tool output above)"; exit 1; }

      - name: Copy authentic files into APK assets
        run: |
          mkdir -p RANMobile/Android/app/src/main/assets/ep7auth
          cp bundle/* RANMobile/Android/app/src/main/assets/ep7auth/
          ls -la RANMobile/Android/app/src/main/assets/ep7auth/

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK (x86_64 for the emulator)
        working-directory: RANMobile/Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          gradle assembleDebug -PemulatorOnly --no-daemon
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Enable KVM
        run: |
          sudo -E apt-get -y install cpu-checker
          kvm-ok || true
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm || true

      - name: Create AVD and boot emulator (SwiftShader GLES3)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          # Newer avdmanager writes AVDs under ~/.config/.android/avd while the
          # emulator searches $ANDROID_AVD_HOME then ~/.android/avd — pin both to
          # one directory so "create" and "launch" agree (B19 CI fix).
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;default;x86_64" >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n gpu-test \
            -k "system-images;android-30;default;x86_64" -d pixel --force
          ls -la "$ANDROID_AVD_HOME" || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd gpu-test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on \
            > emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          # NOTE: 'adb wait-for-device' blocks forever if the emulator never comes
          # up — poll 'adb devices' (never blocks) with a hard budget instead.
          adb_ok=0
          for i in $(seq 1 60); do
            if "$ADB" devices 2>/dev/null | grep -qE "emulator-[0-9]+[[:space:]]+device"; then
              adb_ok=1
              echo "device online after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          if [ "$adb_ok" != "1" ]; then
            echo "::error::emulator device never appeared in adb within 300s"
            tail -n 40 emulator.log | while IFS= read -r line; do echo "::error::$line"; done || true
            "$ADB" devices -l || true
            exit 1
          fi
          boot_ok=0
          for i in $(seq 1 180); do
            boot=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")
            if [ "$boot" = "1" ]; then
              boot_ok=1
              echo "emulator booted after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          if [ "$boot_ok" != "1" ]; then
            echo "::error::emulator did not finish booting within 900s"
            tail -n 40 emulator.log | while IFS= read -r line; do echo "::error::$line"; done || true
            "$ADB" devices -l || true
            exit 1
          fi
          "$ADB" shell getprop ro.build.version.release || true

      - name: Install APK and run GPU selftest
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # NOTE: GH Actions runs steps under `bash -e` — a failing poll/timeout
          # aborts the step BEFORE the diagnostics below unless we add `|| true`.
          timeout 180 "$ADB" install -r RANMobile/Android/app/build/outputs/apk/debug/app-debug.apk \
            || { echo "::error::adb install failed or timed out"; exit 1; }
          echo "::notice::install completed"
          amout=$(timeout 60 "$ADB" shell am start -n com.famhawaii.ranmobile/android.app.NativeActivity --es selftest gpu 2>&1 | tr -d '\r') \
            || { echo "::error::am start failed or timed out"; printf '%s\n' "$amout" | while IFS= read -r line; do echo "::error::$line"; done || true; exit 1; }
          printf '%s\n' "$amout" | while IFS= read -r line; do echo "::notice::am: $line"; done || true
          echo "::notice::am start completed, polling for verdict"
          sleep 8
          # Capture the app's STARTUP logcat window NOW — a few seconds after the
          # intent — these lines rotate out of the buffer later and end-of-poll
          # dumps have repeatedly missed them.  No 'adb root' here or anywhere:
          # it restarts adbd and breaks the following commands (observed twice).
          app_pid=$("$ADB" shell "ps -A 2>/dev/null | grep -w com.famhawaii.ranmobile" 2>/dev/null | head -n 1 | tr -d '\r' || true)
          if [ -n "$app_pid" ]; then
            echo "::notice::app process alive: $app_pid"
          else
            echo "::error::app process not alive 8s after am start"
          fi
          "$ADB" shell "dmesg 2>/dev/null | grep -iE 'killed process|lowmemory|out of memory' | tail -n 6" | while IFS= read -r line; do echo "::error::dmesg|$line"; done || true
          "$ADB" logcat -d 2>/dev/null | grep -iE "ranmobile|start proc|nativeactivity|linker|DEBUG|FATAL|AndroidRuntime|selftest|gpu self" | tail -n 35 | while IFS= read -r line; do echo "::error::start|$line"; done || true
          if [ -n "$app_pid" ]; then
            "$ADB" shell "ps -T -p $(pidof com.famhawaii.ranmobile) 2>/dev/null | head -n 14" | while IFS= read -r line; do echo "::error::thr|$line"; done || true
          fi
          timeout 600 bash -c '
            while true; do
              out=$("$ADB" exec-out run-as com.famhawaii.ranmobile cat files/gpu_selftest.json 2>/dev/null)
              if [ -n "$out" ]; then
                echo "$out" > gpu_selftest.json
                echo "=== GPU SELFTEST VERDICT ==="
                cat gpu_selftest.json
                break
              fi
              sleep 5
            done' || true
          if [ ! -f gpu_selftest.json ]; then
            echo "::error::selftest did not produce gpu_selftest.json in time"
            # Emit the app's logcat (crashes, harness logs, EGL/GLES errors) as
            # annotations — they are the only log channel readable from outside.
            "$ADB" logcat -d -b crash 2>/dev/null | tail -n 25 | while IFS= read -r line; do echo "::error::crash|$line"; done || true
            "$ADB" logcat -d 2>/dev/null | grep -iE "ranmobile|nativeactivity|linker|DEBUG|FATAL|AndroidRuntime|EGL|selftest|GLES" | tail -n 60 | while IFS= read -r line; do echo "::error::log|$line"; done || true
            "$ADB" shell "ps -T -p $(pidof com.famhawaii.ranmobile) 2>/dev/null | head -n 16" | while IFS= read -r line; do echo "::error::thr|$line"; done || true
            "$ADB" shell "dumpsys package com.famhawaii.ranmobile | grep -E 'primaryCpuAbi|versionName' | head -n 3" || true
            "$ADB" shell "run-as com.famhawaii.ranmobile ls -la files/ 2>&1" | while IFS= read -r line; do echo "::error::files|$line"; done || true
            echo "::notice::poll budget exhausted (600s) — diagnostics above"
            tail -n 20 emulator.log || true
            exit 1
          fi
          # Pull the screenshot through run-as (app-internal files dir).
          "$ADB" exec-out run-as com.famhawaii.ranmobile cat files/gpu_selftest.ppm > gpu_selftest.ppm || true
          "$ADB" logcat -d > emulator-logcat.txt || true
          verdict=$(python3 -c "import json;print(json.load(open('gpu_selftest.json'))['verdict'])" 2>/dev/null || echo UNKNOWN)
          renderer=$(python3 -c "import json;print(json.load(open('gpu_selftest.json')).get('gl',{}).get('renderer',''))" 2>/dev/null || echo "")
          echo "GPU renderer: $renderer"
          echo "GPU selftest verdict: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "GPU renderer: $renderer" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != "PASS" ]; then
            echo "::error::GPU selftest verdict = $verdict"
            exit 1
          fi

      - name: Upload GPU selftest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-gpu-selftest
          path: |
            gpu_selftest.json
            gpu_selftest.ppm
            emulator-logcat.txt
            emulator.log
