name: Build RANMobile Android (ARM64) & Verify EP7 Release
on:
  workflow_dispatch: null
  push:
    branches:
    - main
    - arena/**
jobs:
  core-tests:
    name: Core C++17 tests (blocking)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "mkdir -p external/ep7_release/original external/ep7_release/client_original external/ep7_release/thaipack_original\ngh release download ran-ep7-full-v1 \\\n  --repo famoh01/ran-online-ep7 \\\n  --pattern \"RAN-EP7-Client-TH.zip.part*\" \\\n  --pattern \"RAN-EP7-ThaiPack-FamHawaii.zip\" \\\n  --dir external/ep7_release/original\ncat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \\\n    external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \\\n    > external/ep7_release/original/RAN-EP7-Client-TH.zip\nunzip -t external/ep7_release/original/RAN-EP7-Client-TH.zip > /dev/null\nunzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original\nunzip -q -o external/ep7_release/original/RAN-EP7-ThaiPack-FamHawaii.zip -d external/ep7_release/thaipack_original\necho \"=== EP7 DATA VERIFICATION ===\"\nfind external/ep7_release/client_original -maxdepth 3 \\( -iname \"mapslist.mst\" -o -iname \"crow.mnsf\" -o -iname \"item.isf\" -o\
        \ -iname \"skill.ssf\" -o -iname \"quest.lst\" \\)\n"
    - name: Run Linux C++17 Unit & Integration Tests
      run: "g++ -std=c++17 -Wall -Wextra -Werror \\\n  RANMobile/Engine/Core/Logger.cpp \\\n  RANMobile/Engine/Core/RANMobileEngine.cpp \\\n  RANMobile/Engine/Renderer/MobileRenderer.cpp \\\n  RANMobile/Engine/Resource/ResourceManager.cpp \\\n  RANMobile/Engine/Touch/TouchSystem.cpp \\\n  RANMobile/Engine/Camera/MobileCamera.cpp \\\n  RANMobile/Engine/Animation/AnimationManager.cpp \\\n  RANMobile/Engine/Animation/EP7SkinAniControl.cpp \\\n  RANMobile/Engine/Audio/AudioManager.cpp \\\n  RANMobile/Engine/Network/NetworkClient.cpp \\\n  RANMobile/Data/Validator/DataValidator.cpp \\\n  RANMobile/Data/Importer/EP7AssetImporter.cpp \\\n  RANMobile/Data/Importer/EP7TextureDecoder.cpp \\\n  RANMobile/Data/Importer/EP7WorldCharParser.cpp \\\n  RANMobile/Data/Importer/EP7Animation.cpp \\\n  RANMobile/Data/Importer/EP7CharacterFile.cpp \\\n  RANMobile/Data/Importer/EP7RccArchive.cpp \\\n  RANMobile/Data/Importer/EP7Skeleton.cpp \\\n  RANMobile/Data/Importer/EP7SkinPiece.cpp \\\n  RANMobile/Data/Importer/EP7SkinnedMesh.cpp\
        \ \\\n  RANMobile/Data/Importer/EP7XFile.cpp \\\n  RANMobile/Engine/Scene/EP7CharacterScene.cpp \\\n  RANMobile/UI/Character/CharacterPreviewOverlay.cpp \\\n  RANMobile/Data/Converter/RANMobileDataConverter.cpp \\\n  RANMobile/Data/Loader/GameDataLoader.cpp \\\n  RANMobile/Data/Loader/ThaiPackLoader.cpp \\\n  RANMobile/Client/Login/AuthenticationManager.cpp \\\n  RANMobile/Client/Character/CharacterSelectManager.cpp \\\n  RANMobile/Client/Gameplay/CharacterController.cpp \\\n  RANMobile/Client/Combat/TargetManager.cpp \\\n  RANMobile/Client/Combat/CombatController.cpp \\\n  RANMobile/Client/Inventory/InventoryManager.cpp \\\n  RANMobile/Client/Quest/QuestManager.cpp \\\n  RANMobile/Client/Map/MapManager.cpp \\\n  RANMobile/Client/Chat/ChatManager.cpp \\\n  RANMobile/UI/Login/LoginScreen.cpp \\\n  RANMobile/UI/Joystick/VirtualJoystick.cpp \\\n  RANMobile/UI/Buttons/MobileButton.cpp \\\n  RANMobile/UI/Buttons/MobileSkillButton.cpp \\\n  RANMobile/UI/HUD/MobileHUD.cpp \\\n  RANMobile/UI/Quest/QuestUI.cpp\
        \ \\\n  RANMobile/Server/MobileServerHost.cpp \\\n  RANMobile/Tests/test_main.cpp \\\n  -lpthread -o ranmobile_tests 2>&1 | tee -a compile_output.log\n"
    - name: Run Linux C++17 Tests
      run: "set +e\n./ranmobile_tests > test_output.log 2>&1\nTEST_EXIT=$?\nset -e\necho \"TEST_EXIT=$TEST_EXIT\" >> $GITHUB_ENV\ncat test_output.log\nif [ $TEST_EXIT -ne 0 ]; then\n  ERR_LINE=$(grep -i \"Assertion\\|Aborted\\|Error\\|fail\" test_output.log | tail -n 5 | tr '\\n' ' ')\n  echo \"::error::ranmobile_tests failed (exit $TEST_EXIT): $ERR_LINE\"\nfi\nexit $TEST_EXIT\n"
    - name: Build & Run Phase 3J Character Tests
      run: "set -e\nset -o pipefail\ng++ -std=c++17 -Wall -Wextra -Werror \\\n  RANMobile/Engine/Core/Logger.cpp \\\n  RANMobile/Engine/Renderer/MobileRenderer.cpp \\\n  RANMobile/Engine/Camera/MobileCamera.cpp \\\n  RANMobile/Engine/Scene/EP7CharacterScene.cpp \\\n  RANMobile/Engine/Animation/EP7SkinAniControl.cpp \\\n  RANMobile/Data/Importer/EP7Animation.cpp \\\n  RANMobile/Data/Importer/EP7CharacterFile.cpp \\\n  RANMobile/Data/Importer/EP7RccArchive.cpp \\\n  RANMobile/Data/Importer/EP7Skeleton.cpp \\\n  RANMobile/Data/Importer/EP7SkinPiece.cpp \\\n  RANMobile/Data/Importer/EP7SkinnedMesh.cpp \\\n  RANMobile/Data/Importer/EP7TextureDecoder.cpp \\\n  RANMobile/Data/Importer/EP7XFile.cpp \\\n  RANMobile/Tests/test_phase3j.cpp \\\n  -lpthread -o ranmobile_phase3j_tests\n./ranmobile_phase3j_tests 2>&1 | tee phase3j_test_output.log\n"
    - name: Verifier regression tests (normal, ASan, UBSan, LSan)
      run: 'set -o pipefail

        bash RANMobile/Tests/run_ep7_verifier_tests.sh 2>&1 | tee verifier_test_output.log

        echo "::notice title=Verifier regression and sanitizers::$(grep -E ''Verifier regression:|Sanitizers:'' verifier_test_output.log | tr ''\n'' '';'')"

        '
    - name: Write Test Summary
      if: always()
      run: "{\n  echo \"### Core C++17 Test Summary: ${{ job.status }}\"\n  echo \"- Exit Code: ${TEST_EXIT:-unknown}\"\n  echo '```'\n  tail -n 60 test_output.log 2>/dev/null || echo \"No test_output.log\"\n  echo '```'\n  echo \"### Phase 3J Character Tests\"\n  echo '```'\n  tail -n 30 phase3j_test_output.log 2>/dev/null || echo \"No phase3j_test_output.log\"\n  echo '```'\n  echo \"### external/ep7_release\"\n  ls -la external/ep7_release 2>/dev/null || echo \"Missing external/ep7_release\"\n  ls -la external/ep7_release/thaipack_original 2>/dev/null | head -n 20 || echo \"Missing thaipack_original\"\n} >> $GITHUB_STEP_SUMMARY\n"
    - name: Upload Failed Test Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-test-logs
        path: 'test_output.log

          phase3j_test_output.log

          verifier_test_output.log

          '
  authentic-assets:
    name: Authentic EP7 asset verification (diagnostic)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "mkdir -p external/ep7_release/original external/ep7_release/client_original external/ep7_release/thaipack_original\ngh release download ran-ep7-full-v1 \\\n  --repo famoh01/ran-online-ep7 \\\n  --pattern \"RAN-EP7-Client-TH.zip.part*\" \\\n  --pattern \"RAN-EP7-ThaiPack-FamHawaii.zip\" \\\n  --dir external/ep7_release/original\ncat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \\\n    external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \\\n    > external/ep7_release/original/RAN-EP7-Client-TH.zip\nunzip -t external/ep7_release/original/RAN-EP7-Client-TH.zip > /dev/null\nunzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original\nunzip -q -o external/ep7_release/original/RAN-EP7-ThaiPack-FamHawaii.zip -d external/ep7_release/thaipack_original\necho \"=== EP7 DATA VERIFICATION ===\"\nfind external/ep7_release/client_original -maxdepth 3 \\( -iname \"mapslist.mst\" -o -iname \"crow.mnsf\" -o -iname \"item.isf\" -o\
        \ -iname \"skill.ssf\" -o -iname \"quest.lst\" \\)\n"
    - name: Verify Authentic EP7 Character Assets
      run: "set -e\ng++ -std=c++17 -Wall -Wextra -Werror \\\n  RANMobile/Data/Importer/EP7Animation.cpp \\\n  RANMobile/Data/Importer/EP7CharacterFile.cpp \\\n  RANMobile/Data/Importer/EP7RccArchive.cpp \\\n  RANMobile/Data/Importer/EP7Skeleton.cpp \\\n  RANMobile/Data/Importer/EP7SkinPiece.cpp \\\n  RANMobile/Data/Importer/EP7SkinnedMesh.cpp \\\n  RANMobile/Data/Importer/EP7TextureDecoder.cpp \\\n  RANMobile/Data/Importer/EP7XFile.cpp \\\n  RANMobile/Engine/Core/Logger.cpp \\\n  RANMobile/Engine/Renderer/MobileRenderer.cpp \\\n  RANMobile/Engine/Camera/MobileCamera.cpp \\\n  RANMobile/Engine/Scene/EP7CharacterScene.cpp \\\n  RANMobile/Engine/Animation/EP7SkinAniControl.cpp \\\n  RANMobile/Tools/verify_ep7_character_assets.cpp \\\n  -o verify_ep7_character_assets\nif [ -d external/ep7_release/client_original ]; then\n  set +e\n  ./verify_ep7_character_assets external/ep7_release/client_original \\\n    2>&1 | tee phase3j_authentic_assets.log\n  verify_status=${PIPESTATUS[0]}\n  set -e\n\
        else\n  echo \"external/ep7_release/client_original missing; nothing verified.\" \\\n    | tee phase3j_authentic_assets.log\n  verify_status=3\nfi\necho \"verify_ep7_character_assets exit status: ${verify_status}\"\n\nok_count=$(grep -c '^  \\[ OK \\] ' phase3j_authentic_assets.log || true)\narc_count=$(grep -c '^--- archive ' phase3j_authentic_assets.log || true)\nbad_count=$(grep -c '^  \\[FAIL\\] ' phase3j_authentic_assets.log || true)\nunsup_count=$(grep -c '^  \\[UNSUP\\] ' phase3j_authentic_assets.log || true)\nverdict=$(grep '^VERDICT: ' phase3j_authentic_assets.log | head -1 || true)\npacks=$(grep '^pack entries ' phase3j_authentic_assets.log | head -1 || true)\nreasons=$(grep -E '^ +[0-9]+ x ' phase3j_authentic_assets.log | head -8 | tr '\\n' ';' || true)\n\ncase \"${verify_status}\" in\n  0) outcome=\"PASS\" ;;\n  1) outcome=\"FAIL\" ;;\n  2) outcome=\"UNSUPPORTED\" ;;\n  3) outcome=\"NOT FOUND\" ;;\n  *) outcome=\"ERROR(${verify_status})\" ;;\nesac\necho \"ASSET_VERIFY_OUTCOME=$outcome\"\
        \ >> \"$GITHUB_ENV\"\necho \"ASSET_VERIFY_EXIT=$verify_status\" >> \"$GITHUB_ENV\"\n\n# Annotations are the only channel that survives without credentials, and GitHub\n# keeps only the first ~10 per check run -- so the verdict goes first.\ncase \"${verify_status}\" in\n  0) echo \"::notice title=Asset verification: PASS::${packs:-$ok_count ok} -- ${verdict:-all pack entries parsed}\" ;;\n  1) echo \"::error title=Asset verification: FAIL::${packs:-$ok_count ok / $bad_count failed} -- ${verdict:-pack entries failed}\" ;;\n  2) echo \"::warning title=Asset verification: UNSUPPORTED (B11)::$unsup_count pack entries are of a format this build has no definition for. NOT a regression and NOT counted as parsed; core tests are unaffected. ${packs}\" ;;\n  *) echo \"::warning title=Asset verification: NOT FOUND::no authentic character entries were found; nothing was verified.\" ;;\nesac\necho \"::notice title=B11 bin classifications::$(grep '^bin classifications' phase3j_authentic_assets.log\
        \ | tr '\\n' ';')\"\n# B20: census + per-version smallest-example tails + full dump of the\n# smallest unsupported .chf -- the evidence the parser extension is built\n# on. Emitted FIRST so the annotation cap keeps them.\ncensus=$(grep -E \"^  chf-census: \" phase3j_authentic_assets.log | tr \"\\n\" \";\" || true)\nif [ -n \"$census\" ]; then\n  echo \"::warning title=chf version census::$census\"\nfi\ngrep \"^  chf-tail: \" phase3j_authentic_assets.log 2>/dev/null | head -5 |\n  while IFS= read -r tl; do\n    echo \"::warning title=chf tail::${tl#*  }\"\n  done\ngrep \"^  chf-dump\" phase3j_authentic_assets.log 2>/dev/null | head -4 |\n  while IFS= read -r dl; do\n    echo \"::warning title=chf dump::${dl#*  }\"\n  done\ngrep \"^  chf-fail: \" phase3j_authentic_assets.log 2>/dev/null | head -8 |\n  while IFS= read -r fl; do\n    echo \"::warning title=chf payload failure::${fl#*  }\"\n  done\ngrep \"^  chf-fail-tail: \" phase3j_authentic_assets.log 2>/dev/null | head -4 |\n  while IFS= read -r ftl; do\n    echo \"::warning title=chf failure tail::${ftl#*  }\"\n  done\ngrep \"^  chf-fail-dump\" phase3j_authentic_assets.log 2>/dev/null | head -11 |\n  while IFS= read -r fdl; do\n    echo \"::warning title=chf failure dump::${fdl#*  }\"\n  done\nif [ -n \"$reasons\" ]; then\n  echo \"::warning title=Asset verification - failure reasons::${reasons}\"\nfi\nif [ \"$unsup_count\" -gt 0 ]; then\n  echo \"::warning title=Asset verification - unsupported formats (B11)::$(grep -c '^  \\[UNSUP\\] ' phase3j_authentic_assets.log || true) entries; see the job summary for the aggregated list.\"\nfi\ngrep '^  \\[FAIL\\] ' phase3j_authentic_assets.log 2>/dev/null | head -8 | \\\n  while IFS= read -r line; do\n    echo \"::warning title=Authentic asset FAILED::${line}\"\n  done\n\n{\n  echo \"### Authentic Asset Verification: ${outcome}\"\n  echo \"\"\n  echo \"| Metric | Count |\"\n  echo \"|---|---|\"\n  echo \"| parsed (PASS) | ${ok_count} |\"\n  echo \"| failed (FAIL) | ${bad_count} |\"\n  echo \"| unsupported (UNSUPPORTED, B11) | ${unsup_count} |\"\n  echo \"| archives examined | ${arc_count} |\"\n  echo \"\"\n  echo \"\\`${packs:-no pack line}\\`\"\n  echo \"\"\n  echo \"\\`${verdict:-no verdict line}\\`\"\n \
        \ echo \"\"\n  echo \"**UNSUPPORTED is not a pass.** Those entries belong to formats with no\"\n  echo \"definition in this repository (B11); they are neither parsed nor reported\"\n  echo \"as successful.\"\n  echo \"\"\n  echo '```'\n  sed -n '/unsupported formats (real data/,$p' phase3j_authentic_assets.log 2>/dev/null | head -20 || true\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\n{\n  echo \"\"\n  echo \"### chf version census (B20)\"\n  echo '```'\n  grep '^  chf-' phase3j_authentic_assets.log 2>/dev/null | head -24 || true\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ \"${verify_status}\" -eq 1 ]; then\n  echo \"Failing this job: authentic pack entries exist that this build cannot parse.\"\n  exit 1\nfi\n"
    - name: Upload authentic verifier log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase3j-authentic-assets-log
        path: phase3j_authentic_assets.log
  android-arm64:
    name: Android ARM64 build (lib + APK/AAB)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
    - name: Build RANMobile Native Library (arm64-v8a)
      run: "rm -rf build-android-arm64\ncmake -S RANMobile -B build-android-arm64 \\\n  -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \\\n  -DANDROID_ABI=arm64-v8a \\\n  -DANDROID_PLATFORM=android-24\ncmake --build build-android-arm64 -j 2>&1 | tee arm64-build.log\nif [ ! -f build-android-arm64/libranmobile.so ]; then\n  grep -E \"error:\" arm64-build.log | head -n 12 | while IFS= read -r line; do echo \"::error::$line\"; done\n  exit 1\nfi\nfile build-android-arm64/libranmobile.so\n"
    - name: Upload ARM64 Native Library Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libranmobile-arm64-v8a
        path: build-android-arm64/libranmobile.so
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
    - name: Build Android APK & AAB (assembleDebug, assembleRelease, bundleRelease)
      working-directory: RANMobile/Android
      run: 'gradle assembleDebug assembleRelease bundleRelease

        ls -lh app/build/outputs/apk/debug/*.apk

        ls -lh app/build/outputs/apk/release/*.apk

        ls -lh app/build/outputs/bundle/release/*.aab

        '
    - name: Upload APK & AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ranmobile-android-packages
        path: 'RANMobile/Android/app/build/outputs/apk/debug/*.apk

          RANMobile/Android/app/build/outputs/apk/release/*.apk

          RANMobile/Android/app/build/outputs/bundle/release/*.aab

          '
  android-emulator-gpu-verification:
    name: Android Emulator GPU verification (GLES3 selftest)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Download & Extract Original EP7 Client Data (ran-ep7-full-v1)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "mkdir -p external/ep7_release/original external/ep7_release/client_original\ngh release download ran-ep7-full-v1 \\\n  --repo famoh01/ran-online-ep7 \\\n  --pattern \"RAN-EP7-Client-TH.zip.part*\" \\\n  --dir external/ep7_release/original\ncat external/ep7_release/original/RAN-EP7-Client-TH.zip.part00 \\\n    external/ep7_release/original/RAN-EP7-Client-TH.zip.part01 \\\n    > external/ep7_release/original/RAN-EP7-Client-TH.zip\nunzip -q -o external/ep7_release/original/RAN-EP7-Client-TH.zip -d external/ep7_release/client_original\n"
    - name: Build verify tool
      run: "g++ -std=c++17 -Wall -Wextra -Werror \\\n  RANMobile/Data/Importer/EP7Animation.cpp \\\n  RANMobile/Data/Importer/EP7CharacterFile.cpp \\\n  RANMobile/Data/Importer/EP7RccArchive.cpp \\\n  RANMobile/Data/Importer/EP7Skeleton.cpp \\\n  RANMobile/Data/Importer/EP7SkinPiece.cpp \\\n  RANMobile/Data/Importer/EP7SkinnedMesh.cpp \\\n  RANMobile/Data/Importer/EP7TextureDecoder.cpp \\\n  RANMobile/Data/Importer/EP7XFile.cpp \\\n  RANMobile/Engine/Core/Logger.cpp \\\n  RANMobile/Engine/Renderer/MobileRenderer.cpp \\\n  RANMobile/Engine/Camera/MobileCamera.cpp \\\n  RANMobile/Engine/Scene/EP7CharacterScene.cpp \\\n  RANMobile/Engine/Animation/EP7SkinAniControl.cpp \\\n  RANMobile/Tools/verify_ep7_character_assets.cpp \\\n  -o verify_ep7_character_assets\n"
    - name: Select authentic character files for the APK bundle
      run: 'mkdir -p bundle

        ./verify_ep7_character_assets external/ep7_release/client_original --bundle-plan bundle "" || true

        ls -la bundle/

        [ -f bundle/manifest.txt ] || { echo "::error::bundle-plan produced no manifest (see the tool output above)"; exit 1; }

        '
    - name: Copy authentic files into APK assets
      run: 'mkdir -p RANMobile/Android/app/src/main/assets/ep7auth

        cp bundle/* RANMobile/Android/app/src/main/assets/ep7auth/

        ls -la RANMobile/Android/app/src/main/assets/ep7auth/

        '
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
    - name: Build debug APK (x86_64 for the emulator)
      working-directory: RANMobile/Android
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: 'gradle assembleDebug -PemulatorOnly --no-daemon 2>&1 | tee emu-build.log

        grep -E "error:|error :|FAILURE: Build failed" emu-build.log | head -n 12 > emuerr.txt || true

        if [ -s emuerr.txt ]; then while IFS= read -r line; do echo "::error::$line"; done < emuerr.txt; fi

        ls -lh app/build/outputs/apk/debug/*.apk

        ls -lh app/build/outputs/apk/debug/*.apk

        '
    - name: Enable KVM
      run: 'sudo -E apt-get -y install cpu-checker

        kvm-ok || true

        ls -l /dev/kvm

        sudo chmod a+rw /dev/kvm || true

        '
    - name: Create AVD and boot emulator (SwiftShader GLES3)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_AVD_HOME: /home/runner/.android/avd
      run: "mkdir -p \"$ANDROID_AVD_HOME\"\nyes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses >/dev/null || true\n\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" \"system-images;android-30;default;x86_64\" >/dev/null\n\"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd -n gpu-test \\\n  -k \"system-images;android-30;default;x86_64\" -d pixel --force\nls -la \"$ANDROID_AVD_HOME\" || true\nnohup \"$ANDROID_HOME/emulator/emulator\" -avd gpu-test \\\n  -no-window -no-audio -no-boot-anim -no-snapshot \\\n  -gpu swiftshader_indirect -accel on \\\n  > emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\n# NOTE: 'adb wait-for-device' blocks forever if the emulator never comes\n# up \u2014 poll 'adb devices' (never blocks) with a hard budget instead.\nadb_ok=0\nfor i in $(seq 1 60); do\n  if \"$ADB\" devices 2>/dev/null | grep -qE \"emulator-[0-9]+[[:space:]]+device\"; then\n    adb_ok=1\n    echo \"device online after ~$((i * 5))s\"\n    break\n\
        \  fi\n  sleep 5\ndone\nif [ \"$adb_ok\" != \"1\" ]; then\n  echo \"::error::emulator device never appeared in adb within 300s\"\n  tail -n 40 emulator.log | while IFS= read -r line; do echo \"::error::$line\"; done || true\n  \"$ADB\" devices -l || true\n  exit 1\nfi\nboot_ok=0\nfor i in $(seq 1 180); do\n  boot=$(\"$ADB\" shell getprop sys.boot_completed 2>/dev/null | tr -d \"\\r\")\n  if [ \"$boot\" = \"1\" ]; then\n    boot_ok=1\n    echo \"emulator booted after ~$((i * 5))s\"\n    break\n  fi\n  sleep 5\ndone\nif [ \"$boot_ok\" != \"1\" ]; then\n  echo \"::error::emulator did not finish booting within 900s\"\n  tail -n 40 emulator.log | while IFS= read -r line; do echo \"::error::$line\"; done || true\n  \"$ADB\" devices -l || true\n  exit 1\nfi\n\"$ADB\" shell getprop ro.build.version.release || true\n# Settle: launches within ~1 min of boot_completed showed a wedged\n# EGL/init state (app stuck before selftest); 30 s lets the guest\n# graphics stack finish coming up.\nsleep\
        \ 30\n# Take root NOW: 'adb root' restarts adbd (adb is broken for a few\n# seconds) \u2014 doing it minutes before the poll, with a settle + check,\n# lets the verdict be read with a plain root cat (run-as cat returns\n# empty on this API-30 image \u2014 observed in CI).\n\"$ADB\" root >/dev/null 2>&1 || true\n# Wait until adbd is REALLY back in 'device' state (the header line\n# 'List of devices attached' also contains the word 'device' \u2014 match\n# the state column specifically).\nadb_ok=0\nfor i in $(seq 1 12); do\n  if \"$ADB\" devices 2>/dev/null | grep -qE \"emulator-[0-9]+[[:space:]]+device[[:space:]]*$\"; then\n    adb_ok=1\n    break\n  fi\n  sleep 5\ndone\n[ \"$adb_ok\" = \"1\" ] || echo \"::warning::emulator not in device state 60s after adb root\"\n\"$ADB\" shell \"id -u\" 2>/dev/null | tr -d '\\r' || true\n"
    - name: Install APK and run GPU selftest
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: "ADB=\"$ANDROID_HOME/platform-tools/adb\"\n# NOTE: GH Actions runs steps under `bash -e` - a failing command aborts the\n# step BEFORE the diagnostics below unless we add `|| true` guards.\ninstall_ok=0\nfor attempt in 1 2; do\n  if timeout 240 \"$ADB\" install -r RANMobile/Android/app/build/outputs/apk/debug/app-debug.apk; then\n    install_ok=1\n    break\n  fi\n  echo \"::warning::adb install attempt $attempt failed - retrying in 15s\"\n  sleep 15\ndone\n[ \"$install_ok\" = \"1\" ] || { echo \"::error::adb install failed or timed out after 2 attempts\"; exit 1; }\necho \"::notice::install completed\"\n\"$ADB\" logcat -G 4M 2>/dev/null || true\n\n# LOCAL REASSEMBLER: rebuilds gpu_selftest.json from a chunks_raw.txt\n# SNAPSHOT taken while adb was alive - the decisive evidence path needs\n# ZERO further adb commands, so a post-launch adb wedge cannot lose the\n# verdict (B19 CI evidence: adbd died mid-poll twice; host-side reconnect\n# cannot revive a device-side wedge).\nverdict_from_chunks=0\nreassemble_from_chunks() {\n  lc=$(grep \"GPUSELFTEST_JSON: \" chunks_raw.txt 2>/dev/null | sed -E \"s/^.*GPUSELFTEST_JSON: //\")\n  [ -n \"$lc\" ] || return 1\n  spec=$(printf \"%s\\n\" \"$lc\" | head -n1 | cut -d\" \" -f1)\n  total=${spec#*/}\n  [ -n \"$total\" ] && [ \"$total\" -ge 1 ] 2>/dev/null || return 1\n  json=\"\"\n  ok=1\n  for i in $(seq 1 \"$total\"); do\n    piece=$(printf \"%s\\n\" \"$lc\" | grep -E \"^$i/$total \" | head -n1 | cut -d\" \" -f2-)\n    [ -n \"$piece\" ] || { ok=0; break; }\n    json=\"$json$piece\"\n  done\n  [ \"$ok\" = \"1\" ] || return 1\n  printf \"%s\" \"$json\" | grep -q verdict || return 1\n  printf \"%s\" \"$json\" > gpu_selftest.json\n  verdict_from_chunks=1\n  return 0\n}\n\n# BOUNDED LAUNCH LOOP (deterministic): the app may (a) complete and EXIT\n# within ~2 s (verdict chunks already in logcat, process gone - \"not alive\"\n# is then a SUCCESS signal), (b) run for a while, or (c) die before\n# android_main on a fresh boot (flaky, observed).  Success = verdict chunks\n# visible OR process alive; 3 bounded\
        \ tries.  All diagnostics emit as\n# ::notice - ::error is capped at 10 per step by GitHub and silently drops\n# everything after, which hid evidence in 4 earlier runs.\nlaunch_ok=0\nfor attempt in 1 2 3; do\n  \"$ADB\" logcat -c 2>/dev/null || true\n  timeout 60 \"$ADB\" shell am start -n com.famhawaii.ranmobile/android.app.NativeActivity --es selftest gpu >/dev/null 2>&1 \\\n    || echo \"::notice::attempt $attempt: am start command failed (retrying)\"\n  ok=0\n  alive_seen=0\n  for i in 1 2 3 4 5 6; do\n    sleep 5\n    $ADB logcat -d -s GPUSELFTEST_JSON 2>/dev/null | grep \"GPUSELFTEST_JSON: \" | tr -d \"\\r\" > chunks_raw.txt || true\n    if [ -s chunks_raw.txt ]; then\n      if reassemble_from_chunks; then\n        echo \"::notice::attempt $attempt: FULL verdict reassembled from logcat snapshot after ~$((i * 5))s\"\n        ok=1\n        break\n      fi\n      echo \"::notice::attempt $attempt: partial chunk snapshot at ~$((i * 5))s - one resnapshot\"\n      sleep 2\n      $ADB logcat -d -s GPUSELFTEST_JSON 2>/dev/null | grep \"GPUSELFTEST_JSON: \" | tr -d \"\\r\" > chunks_raw.txt || true\n      if reassemble_from_chunks; then\n        echo \"::notice::attempt $attempt: FULL verdict reassembled (second snapshot)\"\n        ok=1\n        break\n      fi\n      ok=1\n      break\n    fi\n    alive=$(\"$ADB\" shell \"ps -A 2>/dev/null | grep -w com.famhawaii.ranmobile\" 2>/dev/null | head -n 1 | tr -d \"\\r\" || true)\n    if [ -n \"$alive\" ]; then\n      alive_seen=1\n    fi\n  done\n  if [ \"$alive_seen\" = \"1\" ] && [ \"$ok\" != \"1\" ]; then\n    echo \"::notice::attempt $attempt: app alive 30s, no verdict chunks (poll/recovery follow)\"\n  fi\n  if [ \"$ok\" = \"1\" ] || [ \"$alive_seen\" = \"1\" ]; then launch_ok=1; break; fi\n  # Per-attempt startup-window dump as ::notice (uncounted).\n  \"$ADB\" logcat -d 2>/dev/null | grep -iE \"ranmobile|start proc.*ranmobile|nativeactivity|linker|DEBUG|FATAL|AndroidRuntime\" | tail -n 15 > appattempt.txt || true\n  while IFS= read -r line; do echo \"::notice::att$attempt|$line\"; done < appattempt.txt || true\n  \"$ADB\" shell \"am force-stop com.famhawaii.ranmobile\" 2>/dev/null || true\ndone\nif [ \"$launch_ok\" != \"1\" ]; then\n  echo \"::error::app never launched (died pre-main or process never started) across 3 bounded attempts\"\n  exit 1\nfi\n\n# Verdict poll: reassemble the GPUSELFTEST_JSON chunks from the logcat\n# buffer (primary; survives the app having exited) or root-cat the file\n# (secondary).  adbd wedges after the app exits (observed twice) but\n# recovers after minutes - NEVER give up\
        \ early; keep reconnecting; the\n# 600 s timeout is the only bound.  The 4 MB buffer persists on device.\ncat > poll.sh << 'POLL_EOF'\nadb_fail=0\nwhile true; do\n  lc=$(\"$ADB\" logcat -d -s GPUSELFTEST_JSON 2>/dev/null | grep \"GPUSELFTEST_JSON: \" | tr -d '\\r')\n  if [ -n \"$lc\" ]; then\n    spec=$(printf \"%s\\n\" \"$lc\" | sed -E \"s/^.*GPUSELFTEST_JSON: //\" | head -n1 | cut -d\" \" -f1)\n    total=${spec#*/}\n    if [ -n \"$total\" ] && [ \"$total\" -ge 1 ] 2>/dev/null; then\n      json=\"\"\n      ok=1\n      for i in $(seq 1 \"$total\"); do\n        piece=$(printf \"%s\\n\" \"$lc\" | sed -E \"s/^.*GPUSELFTEST_JSON: //\" | grep -E \"^$i/$total \" | head -n1 | cut -d\" \" -f2-)\n        if [ -z \"$piece\" ]; then ok=0; break; fi\n        json=\"$json$piece\"\n      done\n      if [ \"$ok\" = \"1\" ] && printf \"%s\" \"$json\" | grep -q \"verdict\"; then\n        printf \"%s\" \"$json\" > gpu_selftest.json\n        echo \"=== GPU SELFTEST VERDICT (from logcat) ===\"\n   \
        \     cat gpu_selftest.json\n        exit 0\n      fi\n    fi\n  fi\n  out=$(\"$ADB\" shell \"cat /data/user/0/com.famhawaii.ranmobile/files/gpu_selftest.json 2>/dev/null\" 2>/dev/null | tr -d '\\r')\n  if [ -n \"$out\" ]; then\n    echo \"$out\" > gpu_selftest.json\n    echo \"=== GPU SELFTEST VERDICT (from file) ===\"\n    cat gpu_selftest.json\n    exit 0\n  fi\n  if ! \"$ADB\" get-state >/dev/null 2>&1; then\n    adb_fail=$((adb_fail + 1))\n    if [ $adb_fail -eq 1 ] || [ $((adb_fail % 6)) -eq 0 ]; then\n      echo \"::notice::adb unresponsive (fail $adb_fail) - reconnecting\"\n      \"$ADB\" reconnect offline >/dev/null 2>&1 || true\n    fi\n    if [ $((adb_fail % 12)) -eq 0 ]; then\n      \"$ADB\" kill-server >/dev/null 2>&1 || true\n      sleep 3\n      \"$ADB\" start-server >/dev/null 2>&1 || true\n      \"$ADB\" reconnect offline >/dev/null 2>&1 || true\n    fi\n  else\n    adb_fail=0\n  fi\n  sleep 5\ndone\nPOLL_EOF\nif [ \"$verdict_from_chunks\" = \"1\" ]; then\n  echo \"=== GPU SELFTEST VERDICT (from logcat snapshot) ===\"\n  cat gpu_selftest.json\nelse\n  ADB=\"$ADB\" timeout 600 bash poll.sh || true\nfi\nif [ ! -f gpu_selftest.json ]; then\n  # BOUNDED RELAUNCH RECOVERY: a device-side adbd wedge cannot be revived by\n  # host-side reconnects - but a HOST-side server wedge can (kill/start-server),\n  # and a fresh launch cycle re-runs the ~10 s selftest with fresh adb. One\n  # cycle only; every wait bounded.\n  echo \"::notice::poll produced no verdict - one relaunch recovery cycle\"\n  \"$ADB\" kill-server >/dev/null 2>&1 || true\n  sleep 3\n  \"$ADB\" start-server >/dev/null 2>&1 || true\n  dev_ok=0\n  for i in $(seq 1 12); do\n    if \"$ADB\" devices 2>/dev/null | grep -qE \"emulator-[0-9]+[[:space:]]+device[[:space:]]*$\"; then\n      dev_ok=1\n      break\n    fi\n    sleep 5\n  done\n  if [ \"$dev_ok\" = \"1\" ]; then\n    \"$ADB\" logcat -c 2>/dev/null || true\n    timeout 60 \"$ADB\" shell am start -n com.famhawaii.ranmobile/android.app.NativeActivity --es selftest gpu >/dev/null 2>&1 || true\n    for i in 1 2 3 4 5 6; do\n      sleep 5\n      \"$ADB\" logcat -d -s GPUSELFTEST_JSON 2>/dev/null | grep \"GPUSELFTEST_JSON: \" | tr -d \"\\r\" > chunks_raw.txt || true\n      if reassemble_from_chunks; then\n        echo \"::notice::verdict reassembled after relaunch recovery (~$((i * 5))s)\"\n        break\n      fi\n    done\n  else\n    echo \"::notice::relaunch recovery: device never returned to device state\"\n  fi\nfi\n\n\nif [\
        \ ! -f gpu_selftest.json ]; then\n  echo \"::error::verdict never retrieved within 600s (launch saw chunks: the app completed but adb wedged, or the poll failed)\"\n  \"$ADB\" logcat -d -b crash 2>/dev/null | tail -n 25 | while IFS= read -r line; do echo \"::notice::crash|$line\"; done || true\n  \"$ADB\" logcat -d 2>/dev/null | grep -iE \"ranmobile|nativeactivity|linker|DEBUG|FATAL|AndroidRuntime|EGL|selftest|GLES\" | tail -n 50 | while IFS= read -r line; do echo \"::notice::log|$line\"; done || true\n  echo \"::notice::adb state: $(\"$ADB\" get-state 2>&1 | tr -d \"\\r\" || echo unreachable)\"\n  echo \"::notice::GPUSELFTEST_JSON chunks in buffer: $(\"$ADB\" logcat -d -s GPUSELFTEST_JSON 2>/dev/null | grep -c \"GPUSELFTEST_JSON: \" || echo 0)\"\n  fls=$(\"$ADB\" shell \"ls -la /data/user/0/com.famhawaii.ranmobile/files/ 2>&1\" 2>/dev/null | tr -d \"\\r\")\n  if [ -n \"$fls\" ]; then printf \"%s\\n\" \"$fls\" | while IFS= read -r line; do echo \"::notice::files|$line\"; done; else\
        \ echo \"::notice::files probe returned nothing (adb dead?)\"; fi\n  tail -n 15 emulator.log || true\n  exit 1\nfi\n\n# EVIDENCE PRIORITY: annotations are capped at 10 PER LEVEL per step - the\n# verdict JSON is the decisive evidence (it now embeds the driver's shader\n# compile/link info log), so emit it FIRST and compactly; skip noisy dumps.\n# ::notice budget here: install(1) + attempt(1) + json chunks (<=6) = 8/10.\njsonc=$(jq -c '{verdict, gl, tests, authenticTexture, authentic}' gpu_selftest.json 2>/dev/null || true)\nif [ -z \"$jsonc\" ]; then jsonc=$(tr -d '\\n\\t' < gpu_selftest.json); fi\nprintf '%s\\n' \"$jsonc\" | fold -w 900 -s > jsonchunks.txt || true\nni=0\nwhile IFS= read -r line; do\n  ni=$((ni + 1))\n  echo \"::notice::json$ni|$line\"\ndone < jsonchunks.txt\n# Pull the screenshot (root cat primary, run-as fallback).\n\"$ADB\" shell \"cat /data/user/0/com.famhawaii.ranmobile/files/gpu_selftest.ppm\" > gpu_selftest.ppm 2>/dev/null || true\nif ! grep -q \"P6\" gpu_selftest.ppm\
        \ 2>/dev/null; then\n  \"$ADB\" exec-out run-as com.famhawaii.ranmobile cat files/gpu_selftest.ppm > gpu_selftest.ppm 2>/dev/null || true\nfi\n\"$ADB\" logcat -d > emulator-logcat.txt || true\nverdict=$(python3 -c \"import json;print(json.load(open('gpu_selftest.json'))['verdict'])\" 2>/dev/null || echo UNKNOWN)\nrenderer=$(python3 -c \"import json;print(json.load(open('gpu_selftest.json')).get('gl',{}).get('renderer',''))\" 2>/dev/null || echo \"\")\necho \"GPU renderer: $renderer\"\necho \"GPU selftest verdict: $verdict\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"GPU renderer: $renderer\" >> \"$GITHUB_STEP_SUMMARY\"\n# Per-test results as ::notice (uncounted; visible without artifact access).\nif [ \"$verdict\" != \"PASS\" ]; then\n  echo \"::error::GPU selftest verdict = $verdict (failing tests listed in the notices above)\"\n  exit 1\nfi\n"
    - name: Dump app logcat diagnostics
      if: always()
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        ADB="$ANDROID_HOME/platform-tools/adb"
        # Dedicated step = its own 10-notices-per-step budget; the selftest step's
        # budget was repeatedly exhausted before the app-log dump ran (B19 CI).
        # Newest lines first so the cap keeps the most decisive ones.
        if ! "$ADB" get-state >/dev/null 2>&1; then
          echo "::notice::adb unreachable in diagnostics step"
          exit 0
        fi
        "$ADB" logcat -d 2>/dev/null | grep -E "RANMobile|GpuSelfTest|RANMobileEngine|GPUSELFTEST_JSON|FATAL|SIGSEGV|SIGABRT|linker" | tail -n 10 | tac > applog.txt || true
        n=$(wc -l < applog.txt || echo 0)
        if [ "$n" = "0" ]; then
          # First dump empty: one bounded adb-server restart + retry (a wedged
          # adbd session returns empty logs silently under 2>/dev/null).
          echo "::notice::first logcat dump empty - one bounded adb restart + retry"
          "$ADB" kill-server >/dev/null 2>&1 || true
          sleep 3
          "$ADB" start-server >/dev/null 2>&1 || true
          for i in 1 2 3 4 5 6; do
            "$ADB" devices 2>/dev/null | grep -qE "emulator-[0-9]+[[:space:]]+device[[:space:]]*$" && break
            sleep 5
          done
          "$ADB" logcat -d 2>/dev/null | grep -E "RANMobile|GpuSelfTest|RANMobileEngine|GPUSELFTEST_JSON|FATAL|SIGSEGV|SIGABRT|linker" | tail -n 10 | tac > applog.txt || true
          n=$(wc -l < applog.txt || echo 0)
        fi
        echo "::notice::app-log lines matched: $n (printing newest first, cap 10)"
        while IFS= read -r line; do echo "::notice::app|$line"; done < applog.txt || true
        if [ "$n" = "0" ]; then
          # Kernel-side evidence does not rotate with the logcat buffer.
          "$ADB" shell "dmesg 2>/dev/null | tail -n 12" | tac | while IFS= read -r line; do echo "::notice::dmesg|$line"; done || true
          "$ADB" logcat -d -b events 2>/dev/null | grep -iE "ranmobile|am_proc" | tail -n 8 | tac | while IFS= read -r line; do echo "::notice::ev|$line"; done || true
        fi
        "$ADB" logcat -d > emulator-logcat.txt 2>/dev/null || true

    - name: Upload GPU selftest evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-emulator-gpu-selftest
        path: 'gpu_selftest.json

          gpu_selftest.ppm

          emulator-logcat.txt

          emulator.log

          '
