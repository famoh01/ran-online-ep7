name: Original EP7 Asset Import (Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c988b52-ran-online-ep7
    paths:
      - '.github/workflows/original-asset-import.yml'

jobs:
  import-original-ep7-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download, Reassemble, Verify & Inspect ran-ep7-full-v1
        run: |
          mkdir -p /tmp/ep7_orig /tmp/ep7_client /tmp/ep7_serverdb
          gh release download ran-ep7-full-v1 --repo famoh01/ran-online-ep7 --dir /tmp/ep7_orig
          ls -lh /tmp/ep7_orig > /tmp/report.txt
          sha256sum /tmp/ep7_orig/* >> /tmp/report.txt
          if [ -f /tmp/ep7_orig/RAN-EP7-Client-TH.zip.part00 ] && [ -f /tmp/ep7_orig/RAN-EP7-Client-TH.zip.part01 ]; then
            cat /tmp/ep7_orig/RAN-EP7-Client-TH.zip.part00 /tmp/ep7_orig/RAN-EP7-Client-TH.zip.part01 > /tmp/ep7_orig/RAN-EP7-Client-TH.zip
            unzip -tq /tmp/ep7_orig/RAN-EP7-Client-TH.zip >> /tmp/report.txt 2>&1 || true
            unzip -q /tmp/ep7_orig/RAN-EP7-Client-TH.zip -d /tmp/ep7_client || true
            echo "=== CLIENT FILE COUNTS ===" >> /tmp/report.txt
            find /tmp/ep7_client -type f | wc -l >> /tmp/report.txt
            find /tmp/ep7_client -type f | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]' | sort | uniq -c | sort -nr | head -n 30 >> /tmp/report.txt
          fi
          if [ -f /tmp/ep7_orig/RAN-EP7-ServerDBTools.zip ]; then
            unzip -q /tmp/ep7_orig/RAN-EP7-ServerDBTools.zip -d /tmp/ep7_serverdb || true
            echo "=== SERVERDBTOOLS (.exe/.bak/.mdf/.cfg/.ini) ===" >> /tmp/report.txt
            find /tmp/ep7_serverdb -type f \( -iname "*.exe" -o -iname "*.bak" -o -iname "*.mdf" -o -iname "*.cfg" -o -iname "*.ini" \) | head -n 50 >> /tmp/report.txt
          fi
          cat /tmp/report.txt >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Asset Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: ep7-original-asset-report
          path: /tmp/report.txt
