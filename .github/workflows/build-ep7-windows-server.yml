name: Build EP7 Windows Server (Original Source)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c988b52-ran-online-ep7
    paths:
      - '.github/workflows/build-ep7-windows-server.yml'

jobs:
  build-windows-server:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build LoginServer & Core Server Projects (Win32 Release)
        continue-on-error: true
        run: |
          mkdir build_logs -Force
          msbuild LoginServer/LoginServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /flp:LogFile=build_logs/LoginServer.log;Verbosity=minimal
          msbuild AgentServer/AgentServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /flp:LogFile=build_logs/AgentServer.log;Verbosity=minimal
          msbuild FieldServer/FieldServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /flp:LogFile=build_logs/FieldServer.log;Verbosity=minimal
          msbuild GameServer/GameServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /flp:LogFile=build_logs/GameServer.log;Verbosity=minimal

      - name: Upload Windows Server Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: ep7-windows-server-build-logs
          path: build_logs/
