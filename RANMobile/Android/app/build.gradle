plugins {
    id 'com.android.application'
}

android {
    namespace 'com.famhawaii.ranmobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.famhawaii.ranmobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-ep7"

        ndk {
            // arm64-v8a is the device target; x86_64 lets the Android emulator
            // (x86_64 with KVM on CI) install and run the debug APK — the B19
            // GPU selftest job depends on this second ABI.
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
